[project]
name = "advent-of-code"
version = "0.1.0"
description = "Advent of Code solutions in Python"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ANN", "N", "RUF"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
